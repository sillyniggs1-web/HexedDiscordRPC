name: Build HexedDiscordRPC
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native libs (armeabi-v7a + arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in armeabi-v7a arm64-v8a; do
            cmake -S . -B build/$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$ABI -j
            mkdir -p out/lib/$ABI
            cp build/$ABI/libHexedDiscordRPC.so out/lib/$ABI/
            cp third_party/discord/lib/$ABI/libdiscord_partner_sdk.so out/lib/$ABI/
          done

      - name: Convert SDK jars to dex
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          mkdir -p out/dex
          "$BT/d8" --min-api 21 --lib "$PLAT/android.jar" --output out/dex \
            third_party/discord/java/discord_partner_sdk.jar \
            third_party/discord/java/libwebrtc.jar
          ls -la out/dex

      - uses: actions/upload-artifact@v4
        with:
          name: HexedDiscordRPC
          path: out
